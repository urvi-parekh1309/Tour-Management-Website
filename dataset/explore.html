<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore & Plan - Smart Travel Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Force redirect to home on browser reload -->
    <script>
        if (performance.navigation && performance.navigation.type === 1) {
            window.location.href = 'index.html';
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #F8F2E8;
            --text-dark: #3E2B1E;
            --text-light: #857568;
            --primary-orange: #FE8C2C;
            --btn-bg: #634533;
            --nav-bg: #FAF6F1;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .glass-panel { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .btn-primary { background-color: var(--btn-bg); color: white; transition: all 0.3s; }
        .btn-primary:hover { background-color: #4A3326; transform: translateY(-2px); }
        
        /* Map custom sizing */
        #itinerary-map { height: 400px; border-radius: 12px; z-index: 1;}
        
        /* Loading spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-orange); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: auto;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        input[type="checkbox"]:checked { accent-color: var(--primary-orange); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-4 bg-[#FAF6F1] border-b border-gray-200">
        <a href="index.html" class="flex items-center gap-4 text-decoration-none">
            <div class="w-12 h-12 bg-[#FE8C2C] rounded-full flex items-center justify-center shadow-lg">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
            </div>
            <div>
                <h1 class="text-[#3E2B1E] text-2xl font-bold leading-tight">Smart Travel Planner</h1>
                <p class="text-[0.65rem] uppercase tracking-widest text-[#857568] font-medium">Ministry of Tourism, Govt. of India</p>
            </div>
        </a>
        <nav class="hidden md:flex gap-8 items-center font-medium">
            <a href="index.html" class="text-[#3E2B1E] hover:text-[#FE8C2C] transition">Home</a>
            <a href="#" class="text-[#3E2B1E] hover:text-[#FE8C2C] transition">Destinations</a>
            <a href="#" class="text-[#3E2B1E] hover:text-[#FE8C2C] transition">My Trips</a>
            <div class="px-6 py-2 bg-[#634533] text-white rounded-full cursor-pointer hover:bg-[#4a3224] transition">Sign In</div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 my-4">
        
        <!-- Planner Form (Centered Full Page) -->
        <section class="lg:col-span-12 glass-panel p-10 max-w-3xl mx-auto rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-[#e2d5c8] bg-white h-fit mt-10">
            
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-[#FAF6F1] text-[#FE8C2C] rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-orange-100 shadow-sm">🗺️</div>
                <h2 class="text-3xl font-bold mb-2 serif-font text-[#3E2B1E]">Design Your Next Adventure</h2>
                <p class="text-[1.05rem] text-[#857568]">Tell us your preferences and our smart engine will craft a stunning, personalized day-by-day itinerary just for you.</p>
            </div>
            
            <form id="plannerForm" class="flex flex-col gap-6">
                <!-- Selectors and inputs logic remaining exactly the same ... -->
                
                <!-- Destination -->
                <div>
                    <label class="block text-[0.95rem] font-bold text-[#634533] mb-2 uppercase tracking-wide">Where to?</label>
                    <select id="stateSelect" required class="w-full p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:border-transparent focus:ring-[#FE8C2C] text-lg font-medium text-[#3E2B1E] transition">
                        <option value="">Select a Destination State</option>
                        <option value="delhi2">Delhi NCR</option>
                        <option value="goa">Goa</option>
                        <option value="gujarat">Gujarat</option>
                        <option value="himachal">Himachal Pradesh</option>
                        <option value="kerala">Kerala</option>
                        <option value="ladakh">Ladakh</option>
                        <option value="maharashtra2">Maharashtra</option>
                        <option value="punjab">Punjab</option>
                        <option value="rajasthan">Rajasthan</option>
                        <option value="UttarPradesh">Uttar Pradesh</option>
                        <option value="westbengal">West Bengal</option>
                    </select>
                </div>

                <!-- Duration & Budget Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[0.95rem] font-bold text-[#634533] mb-2 uppercase tracking-wide">Duration (Days)</label>
                        <input type="number" id="duration" min="1" max="30" value="7" required class="w-full p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#FE8C2C] text-lg font-medium transition">
                    </div>
                    <div>
                        <label class="block text-[0.95rem] font-bold text-[#634533] mb-2 uppercase tracking-wide">Max Daily Budget</label>
                        <select id="budgetSelect" class="w-full p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#FE8C2C] text-lg font-medium transition">
                            <option value="99999">No limit</option>
                            <option value="2500">Economy (₹2.5K/day)</option>
                            <option value="5000">Comfort (₹5K/day)</option>
                            <option value="10000">Luxury (₹10K/day)</option>
                        </select>
                    </div>
                </div>

                <!-- Interests Selection -->
                <div>
                    <label class="block text-[0.95rem] font-bold text-[#634533] mb-3 uppercase tracking-wide">Travel Interests</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-orange-50 hover:border-orange-200 transition">
                            <input type="checkbox" name="interests" value="Heritage" class="w-5 h-5 rounded text-[#FE8C2C] border-gray-300">
                            <span class="font-medium text-[#3E2B1E]">Heritage</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-orange-50 hover:border-orange-200 transition">
                            <input type="checkbox" name="interests" value="Religious" class="w-5 h-5 rounded text-[#FE8C2C] border-gray-300">
                            <span class="font-medium text-[#3E2B1E]">Spiritual</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-orange-50 hover:border-orange-200 transition">
                            <input type="checkbox" name="interests" value="Wildlife" class="w-5 h-5 rounded text-[#FE8C2C] border-gray-300">
                            <span class="font-medium text-[#3E2B1E]">Nature</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-orange-50 hover:border-orange-200 transition">
                            <input type="checkbox" name="interests" value="Coastal" class="w-5 h-5 rounded text-[#FE8C2C] border-gray-300">
                            <span class="font-medium text-[#3E2B1E]">Coastal</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-orange-50 hover:border-orange-200 transition">
                            <input type="checkbox" name="interests" value="Festival" class="w-5 h-5 rounded text-[#FE8C2C] border-gray-300">
                            <span class="font-medium text-[#3E2B1E]">Cultural</span>
                        </label>
                    </div>
                </div>

                <div class="mt-6">
                    <button type="submit" class="btn-primary w-full py-4 rounded-xl font-bold flex justify-center items-center gap-3 text-xl shadow-lg border border-[#4a3224]">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        Construct Itinerary
                    </button>
                    <div id="loading" class="loader mt-3"></div>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('plannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const stateFile = document.getElementById('stateSelect').value;
            const stateName = document.getElementById('stateSelect').options[document.getElementById('stateSelect').selectedIndex].text;
            const duration = document.getElementById('duration').value;
            const budgetLimit = document.getElementById('budgetSelect').value;
            
            const interests = Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(el => el.value);

            // Redirect to the new independent itinerary page with URL parameters
            const url = `itinerary.html?stateFile=${encodeURIComponent(stateFile)}&stateName=${encodeURIComponent(stateName)}&duration=${encodeURIComponent(duration)}&budget=${encodeURIComponent(budgetLimit)}&interests=${encodeURIComponent(interests.join(','))}`;
            
            window.location.href = url;
        });
    </script>
</body>
</html>
